<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A2R LAB · Manage links</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F4F0;--card:#fff;--tx:#26215C;--mut:#6B6A66;--line:#E2E0D8;--accent:#534AB7;--accentBg:#EEEDFE;--danger:#C2362F;--ok:#1D9E75;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#1A1740;--card:#26215C;--tx:#EEEDFE;--mut:#AFA9EC;--line:#3C3489;--accent:#CECBF6;--accentBg:#3C3489;--danger:#F09595;color-scheme:dark}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .top h1{font-size:18px;font-weight:600;margin:0;flex:1;display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--tx)}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
  .btn.danger{color:var(--danger)}
  .btn.sm{padding:5px 9px;font-size:13px}
  .icon-btn{border:0;background:none;cursor:pointer;color:var(--mut);padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
  .icon-btn:hover{color:var(--tx);background:var(--accentBg)}
  .icon-btn:disabled{opacity:.25;cursor:default;background:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
  @media (max-width:1000px){.grid{grid-template-columns:1fr}.preview{display:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:600}
  .sec-h .tag{font-weight:500}
  .row{display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .row.off{opacity:.5}
  .row .sw-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px}
  .title b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .title a{font-size:12px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
  .acts{display:flex;align-items:center;gap:2px}
  .tune{grid-column:3 / -1;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .swatches{display:flex;gap:5px}
  .sw{width:20px;height:20px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:var(--tx)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:none;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--mut)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accentBg);color:var(--accent);font-weight:600}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accentBg);color:var(--accent)}
  .handle{display:flex;flex-direction:column}
  .handle .icon-btn{padding:0 4px;font-size:14px}
  .switch{position:relative;width:34px;height:20px;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s}
  .switch span:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked+span{background:var(--ok)}
  .switch input:checked+span:before{transform:translateX(14px)}
  .switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .empty{padding:30px;text-align:center;color:var(--mut)}
  .stack{display:grid;gap:16px}
  .preview{position:sticky;top:16px}
  .preview .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
  .preview iframe{width:100%;height:760px;border:0;display:block}
  dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--tx);box-shadow:0 24px 60px #0005}
  dialog::backdrop{background:#0f0c2a99}
  form.f{padding:20px;display:grid;gap:13px}
  form.f h3{margin:0;font-size:17px}
  label{display:grid;gap:5px;font-weight:500;font-size:13px}
  input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;background:var(--bg)}
  textarea{resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--mut);font-weight:400}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
  .iconprev{display:flex;gap:8px;align-items:center}
  .iconprev i{font-size:22px;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;flex:none}
  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;max-height:150px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:9px;margin-top:6px}
  .picker button{border:1px solid transparent;background:none;border-radius:8px;height:36px;font-size:19px;cursor:pointer;color:var(--tx)}
  .picker button:hover{background:var(--accentBg)}
  .picker button.on{border-color:var(--accent);background:var(--accentBg);color:var(--accent)}
  .login{max-width:380px;margin:14vh auto;padding:26px}
  .login h1{font-size:19px;margin:0 0 6px}
  .login p{color:var(--mut);margin:0 0 16px}
  .err{color:var(--danger);font-size:13px;min-height:1em}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--card);padding:10px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}.toast.err{background:var(--danger);color:#fff}
  .busy{cursor:progress}
</style>
</head>
<body>

<section id="loginView" class="card login" hidden>
  <h1><i class="ti ti-lock"></i> Manage links</h1>
  <p>Enter the admin password.</p>
  <form id="loginForm" class="f" style="padding:0">
    <label>Password <input type="password" id="pw" autocomplete="current-password" required></label>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">Sign in</button>
    <a href="index.html" class="hint" style="text-align:center">Back to page</a>
  </form>
</section>

<div id="appView" class="wrap" hidden>
  <div class="top">
    <h1><i class="ti ti-settings"></i> Manage links</h1>
    <a class="btn" href="index.html"><i class="ti ti-arrow-left"></i> Back to page</a>
    <button class="btn" id="settingsBtn"><i class="ti ti-user-circle"></i> Profile</button>
    <button class="btn primary" id="addBtn"><i class="ti ti-plus"></i> Add link</button>
    <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"><i class="ti ti-logout"></i></button>
  </div>
  <div class="grid">
    <div class="stack" id="list"><div class="card empty">Loading…</div></div>
    <div class="card preview">
      <div class="bar">Preview <button class="icon-btn" id="reloadPrev" aria-label="Refresh preview"><i class="ti ti-refresh"></i></button></div>
      <iframe id="prev" src="index.html" title="Public page preview"></iframe>
    </div>
  </div>
</div>

<dialog id="linkDlg">
  <form class="f" id="linkForm">
    <h3 id="dlgTitle">Add link</h3>
    <input type="hidden" name="id">
    <div class="two">
      <label>Display as
        <select name="type">
          <option value="tile">Tile (colored card)</option>
          <option value="link">List row</option>
          <option value="video">Video card</option>
          <option value="social">Social icon (header)</option>
        </select>
      </label>
      <label class="f-section">Section
        <select id="sectionSel"></select>
        <input name="section" id="sectionNew" placeholder="New section name" hidden>
      </label>
    </div>
    <label>Title <input name="title" required placeholder="Inventory system"></label>
    <label>URL <input name="url" required placeholder="https://… or mailto:…"></label>
    <label class="f-desc">Description <span class="hint">Shown on tall and wide tiles, and in list rows</span>
      <input name="description" placeholder="Find parts and tools"></label>
    <label class="f-icon">Icon <span class="hint">Any <a href="https://tabler.io/icons" target="_blank" rel="noopener">Tabler icon</a> name</span>
      <div class="iconprev"><i class="ti" id="iconPrev"></i><input name="icon" placeholder="Leave blank for automatic" autocomplete="off">
        <button class="btn sm" type="button" id="browseIcons">Browse</button></div>
      <div class="picker" id="iconPicker" hidden></div>
    </label>
    <div class="f-size"><label>Tile size</label><div class="seg" id="sizeSeg" style="margin-top:5px"></div></div>
    <div class="f-color"><label>Color</label><div class="swatches" id="colorSeg" style="margin-top:5px"></div></div>
    <label style="display:flex;align-items:center;gap:10px">
      <span class="switch"><input type="checkbox" name="active"><span></span></span> Visible on page
    </label>
    <div class="err" id="linkErr"></div>
    <div class="foot">
      <button class="btn danger" type="button" id="delInDlg" style="margin-right:auto"><i class="ti ti-trash"></i> Delete</button>
      <button class="btn" type="button" id="cancelLink">Cancel</button>
      <button class="btn primary" type="submit" id="saveLinkBtn">Save link</button>
    </div>
  </form>
</dialog>

<dialog id="setDlg">
  <form class="f" id="setForm">
    <h3>Profile</h3>
    <label>Name <input name="name"></label>
    <label>Bio <textarea name="bio" rows="2"></textarea></label>
    <label>Avatar image URL <input name="avatar"></label>
    <label>Footer text <input name="footer"></label>
    <label>Default theme <span class="hint">Visitors can still switch with the theme button</span>
      <select name="theme"><option value="auto">Follow device setting</option><option value="dark">Dark</option><option value="light">Light</option></select>
    </label>
    <div class="foot">
      <button class="btn" type="button" id="cancelSet">Cancel</button>
      <button class="btn primary" type="submit">Save profile</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const API = window.A2R_API_URL, PW = 'a2r-admin-pw';
const { esc, safeUrl, iconFor, COLORS } = A2R;
let password = sessionStorage.getItem(PW) || '', links = [], settings = {};
const $ = s => document.querySelector(s);
const TYPE_LABEL = { tile: 'Tiles', link: 'List', video: 'Videos', social: 'Header icons' };

function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t.h); t.h = setTimeout(() => t.className = 'toast', 2600); }

async function api(action, payload = {}) {
  document.body.classList.add('busy');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ password, action, ...payload }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Request failed');
    return d;
  } finally { document.body.classList.remove('busy'); }
}

function show(v) { $('#loginView').hidden = v !== 'login'; $('#appView').hidden = v !== 'app'; }

async function load() {
  try {
    const d = await api('list'); links = d.links; settings = d.settings; render(); show('app');
  } catch (e) {
    if (/password/i.test(e.message)) { sessionStorage.removeItem(PW); password = ''; show('login'); $('#loginErr').textContent = 'That password is wrong. Try again.'; }
    else { show('app'); $('#list').innerHTML = `<div class="card empty">Couldn’t reach the sheet: ${esc(e.message)}. Check the API URL in config.js.</div>`; }
  }
}

const normSec = n => String(n || '').replace(/\s+/g, ' ').trim();
const secKey = l => l.type === 'social' ? '\u0000social' : (normSec(l.section).toLowerCase() || 'more links');

function groups() {
  const out = [];
  const socials = links.filter(l => l.type === 'social');
  if (socials.length) out.push({ name: 'Header icons', type: 'social', items: socials });
  links.filter(l => l.type !== 'social').forEach(l => {
    const name = normSec(l.section) || 'More links';
    let g = out.find(x => x.type !== 'social' && x.name.toLowerCase() === name.toLowerCase());
    if (!g) out.push(g = { name, type: l.type, items: [] });
    g.items.push(l);
  });
  return out;
}

function swatches(l) {
  return `<div class="swatches">${Object.keys(COLORS).map(k =>
    `<button class="sw ${k === (l.color || 'sand') ? 'on' : ''}" style="background:${COLORS[k][0]}" data-act="color" data-v="${k}" aria-label="${k}" title="${k}"></button>`).join('')}</div>`;
}
function sizeSeg(l) {
  return `<div class="seg">${['small', 'tall', 'wide'].map(s =>
    `<button class="${(l.size || 'small') === s ? 'on' : ''}" data-act="size" data-v="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>`;
}

function render() {
  const gs = groups();
  if (!gs.length) { $('#list').innerHTML = '<div class="card empty">Add your first link to start building the page.</div>'; return; }
  const firstSec = gs.findIndex(g => g.type !== 'social');
  $('#list').innerHTML = gs.map((g, gi) => `
    <div class="card">
      <div class="sec-h" data-sec="${esc(g.name)}">
        <span style="flex:1;display:flex;gap:8px;align-items:center">${esc(g.name)} <span class="tag">${TYPE_LABEL[g.type] || g.type}</span></span>
        ${g.type === 'social' ? '' : `
        <button class="icon-btn" data-sact="rename" aria-label="Rename section" title="Rename section"><i class="ti ti-pencil"></i></button>
        <button class="icon-btn" data-sact="up" ${gi <= firstSec ? 'disabled' : ''} aria-label="Move section up" title="Move section up"><i class="ti ti-arrow-up"></i></button>
        <button class="icon-btn" data-sact="down" ${gi === gs.length - 1 ? 'disabled' : ''} aria-label="Move section down" title="Move section down"><i class="ti ti-arrow-down"></i></button>`}
      </div>
      ${g.items.map((l, i) => {
        const c = A2R.color(l.color);
        const tunable = l.type === 'tile' || l.type === 'link';
        return `<div class="row ${l.active ? '' : 'off'}" data-id="${esc(l.id)}">
          <div class="handle">
            <button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up"><i class="ti ti-chevron-up"></i></button>
            <button class="icon-btn" data-act="down" ${i === g.items.length - 1 ? 'disabled' : ''} aria-label="Move down"><i class="ti ti-chevron-down"></i></button>
          </div>
          <span class="sw-ic" style="background:${tunable ? c[0] : 'var(--accentBg)'};color:${tunable ? c[1] : 'var(--accent)'}"><i class="ti ti-${esc(l.type === 'video' ? 'player-play' : iconFor(l))}"></i></span>
          <div class="title"><b>${esc(l.title)}${l.type !== g.type ? ` <span class="tag" style="background:#FAEEDA;color:#854F0B" title="This link's type doesn't match its section, so it is shown in the section's style. Edit it to fix.">${esc(l.type)} in ${esc(TYPE_LABEL[g.type] || g.type)}</span>` : ''}</b><a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.url)}</a></div>
          <div class="acts">
            <label class="switch" title="Visible"><input type="checkbox" data-act="toggle" ${l.active ? 'checked' : ''} aria-label="Visible"><span></span></label>
            <button class="icon-btn" data-act="edit" aria-label="Edit"><i class="ti ti-edit"></i></button>
            <button class="icon-btn" data-act="del" aria-label="Delete"><i class="ti ti-trash"></i></button>
          </div>
          ${tunable ? `<div class="tune">${swatches(l)}${l.type === 'tile' ? sizeSeg(l) : ''}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`).join('');
}

function refreshPreview() {
  try { $('#prev').contentWindow.localStorage.removeItem('a2r-cache'); } catch (e) {}
  $('#prev').src = 'index.html?t=' + Date.now();
}

async function saveLink(l, msg) {
  render();
  try { await api('update', { link: l }); if (msg) toast(msg); refreshPreview(); }
  catch (e) { toast(e.message, true); load(); }
}

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (document.body.classList.contains('busy') && b.dataset.act !== 'edit') { e.preventDefault(); return; }
  const row = b.closest('.row'); if (!row) return;
  const l = links.find(x => x.id === row.dataset.id);
  const act = b.dataset.act;
  if (act === 'edit') return openLink(l);
  if (act === 'color') { l.color = b.dataset.v; return saveLink(l); }
  if (act === 'size') { l.size = b.dataset.v; return saveLink(l); }
  if (act === 'toggle') { l.active = b.checked; return saveLink(l, l.active ? 'Link shown' : 'Link hidden'); }
  if (act === 'del') return removeLink(l);
  if (act === 'up' || act === 'down') {
    const g = groups().find(g => g.items.includes(l));
    const k = g.items.indexOf(l), other = g.items[act === 'up' ? k - 1 : k + 1];
    const a = links.indexOf(l), c = links.indexOf(other);
    [links[a], links[c]] = [links[c], links[a]];
    render();
    try { await api('reorder', { ids: links.map(x => x.id) }); refreshPreview(); } catch (err) { toast(err.message, true); load(); }
  }
});

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('[data-sact]'); if (!b || b.disabled) return;
  if (document.body.classList.contains('busy')) return;
  const name = b.closest('.sec-h').dataset.sec;
  const gs = groups(), gi = gs.findIndex(g => g.name === name && g.type !== 'social'), g = gs[gi];
  if (b.dataset.sact === 'rename') {
    const next = normSec(prompt('Rename section', g.name));
    if (!next || next === g.name) return;
    const clash = gs.find(x => x !== g && x.type !== 'social' && x.name.toLowerCase() === next.toLowerCase());
    if (clash && clash.type !== g.type) return toast(`“${clash.name}” already exists with a different style.`, true);
    if (clash && !confirm(`Merge into the existing section “${clash.name}”?`)) return;
    try {
      for (const l of g.items) { l.section = clash ? clash.name : next; await api('update', { link: l }); }
      if (clash) { const items = g.items.slice(); for (const l of items) await placeAtEndOfSection(l); }
      render(); toast('Section renamed'); refreshPreview();
    } catch (err) { toast(err.message, true); load(); }
    return;
  }
  // Move the whole section block above/below its neighbour section
  const other = gs[b.dataset.sact === 'up' ? gi - 1 : gi + 1];
  if (!other || other.type === 'social') return;
  const order = gs.map(x => x === g ? other : x === other ? g : x);
  links = order.flatMap(x => x.items);
  render();
  try { await api('reorder', { ids: links.map(x => x.id) }); refreshPreview(); }
  catch (err) { toast(err.message, true); load(); }
});

async function placeAtEndOfSection(item) {
  links = links.filter(x => x !== item);
  let at = -1;
  links.forEach((x, i) => { if (secKey(x) === secKey(item)) at = i; });
  links.splice(at === -1 ? links.length : at + 1, 0, item);
  await api('reorder', { ids: links.map(x => x.id) });
}

async function removeLink(l) {
  if (!confirm(`Delete “${l.title}”? This can’t be undone.`)) return false;
  try { await api('delete', { id: l.id }); links = links.filter(x => x !== l); render(); toast('Link deleted'); refreshPreview(); return true; }
  catch (e) { toast(e.message, true); return false; }
}

/* ---------- link dialog ---------- */
const lf = $('#linkForm');
let draft = {};

const NEW_SEC = '__new__';
// A section has one display style (tiles, list, videos), so only sections of the chosen style are offered
function sectionsOfType(type) { return groups().filter(g => g.type === type).map(g => g.name); }
function fillSections(current) {
  const names = sectionsOfType(lf.elements.type.value);
  const sel = $('#sectionSel');
  sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('') +
    `<option value="${NEW_SEC}">+ New section…</option>`;
  const match = names.find(n => n.toLowerCase() === normSec(current).toLowerCase());
  sel.value = match || names[0] || NEW_SEC;
  $('#sectionNew').hidden = sel.value !== NEW_SEC;
  $('#sectionNew').value = '';
}
$('#sectionSel').onchange = () => {
  const v = $('#sectionSel').value;
  $('#sectionNew').hidden = v !== NEW_SEC;
  $('#sectionNew').value = v === NEW_SEC ? '' : v;
  if (v === NEW_SEC) $('#sectionNew').focus();
};
function paintPicker() {
  const cur = lf.elements.icon.value.trim();
  $('#iconPicker').innerHTML = A2R.ICONS.map(i =>
    `<button type="button" class="${i === cur ? 'on' : ''}" data-icon="${i}" title="${i}" aria-label="${i}"><i class="ti ti-${i}"></i></button>`).join('');
}
$('#browseIcons').onclick = () => { const p = $('#iconPicker'); p.hidden = !p.hidden; if (!p.hidden) paintPicker(); };
$('#iconPicker').onclick = e => { const b = e.target.closest('[data-icon]'); if (!b) return; lf.elements.icon.value = b.dataset.icon; paintPicker(); paintDialog(); };

function paintDialog() {
  const t = lf.elements.type.value;
  lf.querySelector('.f-section').hidden = t === 'social';
  lf.querySelector('.f-desc').hidden = t === 'social';
  lf.querySelector('.f-icon').hidden = t === 'video';
  lf.querySelector('.f-size').hidden = t !== 'tile';
  lf.querySelector('.f-color').hidden = !(t === 'tile' || t === 'link');
  $('#sizeSeg').innerHTML = sizeSeg(draft);
  $('#colorSeg').innerHTML = swatches(draft).replace(/^<div class="swatches">|<\/div>$/g, '');
  const c = A2R.color(draft.color);
  const ip = $('#iconPrev');
  ip.className = 'ti ti-' + (lf.elements.icon.value.trim() || iconFor({ url: lf.elements.url.value }));
  ip.style.background = c[0]; ip.style.color = c[1];
}
['icon', 'url'].forEach(n => lf.elements[n].addEventListener('input', paintDialog));
lf.elements.type.addEventListener('change', () => {
  // Keep the original section only if it has this style; otherwise pick the first matching one
  fillSections(draft.id && draft.type === lf.elements.type.value ? draft.section : '');
  paintDialog();
});
$('#sizeSeg').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { e.preventDefault(); draft.size = b.dataset.v; paintDialog(); } };
$('#colorSeg').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { e.preventDefault(); draft.color = b.dataset.v; paintDialog(); } };

function openLink(l) {
  lf.reset(); $('#linkErr').textContent = '';
  draft = l ? { ...l } : { type: 'tile', size: 'small', color: 'mint', active: true };
  $('#dlgTitle').textContent = l ? 'Edit link' : 'Add link';
  $('#delInDlg').hidden = !l;
  ['id', 'type', 'title', 'url', 'description', 'icon'].forEach(k => lf.elements[k].value = draft[k] ?? '');
  lf.elements.active.checked = draft.active !== false;
  fillSections(l ? l.section : '');
  $('#iconPicker').hidden = true;
  paintDialog(); $('#linkDlg').showModal(); lf.elements.title.focus();
}
$('#addBtn').onclick = () => openLink(null);
$('#cancelLink').onclick = () => $('#linkDlg').close();
$('#delInDlg').onclick = async () => { const l = links.find(x => x.id === lf.elements.id.value); if (l && await removeLink(l)) $('#linkDlg').close(); };

lf.addEventListener('submit', async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(lf));
  const sel = $('#sectionSel').value;
  f.section = normSec(sel === NEW_SEC ? $('#sectionNew').value : sel);
  const link = { ...draft, ...f, active: lf.elements.active.checked };
  if (link.type === 'social') link.section = '';
  if (link.type !== 'tile') link.size = draft.size || 'small';
  if (!link.title.trim()) return $('#linkErr').textContent = 'Enter a title.';
  if (safeUrl(link.url) === '#') return $('#linkErr').textContent = 'Enter a URL starting with https://, mailto: or tel:';
  if (link.type !== 'social' && !link.section) {
    if (sel === NEW_SEC) return $('#linkErr').textContent = 'Enter a name for the new section.';
    link.section = link.type === 'video' ? 'Watch' : 'More links';
  }
  if (link.type !== 'social') {
    const existing = groups().find(g => g.type !== 'social' && g.name.toLowerCase() === link.section.toLowerCase());
    if (existing && existing.type !== link.type)
      return $('#linkErr').textContent = `“${existing.name}” is a ${TYPE_LABEL[existing.type].toLowerCase()} section. Pick another name or change “Display as”.`;
    if (existing) link.section = existing.name;
  }
  const old = link.id ? links.find(x => x.id === link.id) : null;
  const moved = !old || secKey(old) !== secKey(link) || old.type !== link.type;
  const btn = $('#saveLinkBtn'); btn.disabled = true;
  try {
    if (link.id) {
      await api('update', { link });
      Object.assign(old, link); toast('Link saved');
    } else {
      delete link.id; const d = await api('create', { link }); links.push(d.link); toast('Link added');
    }
    $('#linkDlg').close();
    if (moved) {
      try { await placeAtEndOfSection(link.id ? old : links[links.length - 1]); }
      catch (err) { toast('Saved, but the order could not be updated: ' + err.message, true); await load(); }
    }
    render(); refreshPreview();
  } catch (err) { $('#linkErr').textContent = err.message; }
  finally { btn.disabled = false; }
});

/* ---------- profile dialog ---------- */
const sf = $('#setForm');
$('#settingsBtn').onclick = () => {
  ['name', 'bio', 'avatar', 'footer'].forEach(k => sf.elements[k].value = settings[k] || '');
  sf.elements.theme.value = settings.theme || 'auto';
  $('#setDlg').showModal();
};
$('#cancelSet').onclick = () => $('#setDlg').close();
sf.addEventListener('submit', async e => {
  e.preventDefault();
  try { const d = await api('settings', { settings: Object.fromEntries(new FormData(sf)) }); settings = d.settings; $('#setDlg').close(); toast('Profile saved'); refreshPreview(); }
  catch (err) { toast(err.message, true); }
});

/* ---------- auth ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  const b = e.submitter; if (b) b.disabled = true;
  password = $('#pw').value; sessionStorage.setItem(PW, password);
  await load(); if (b) b.disabled = false; $('#pw').value = '';
});
$('#logoutBtn').onclick = () => { sessionStorage.removeItem(PW); password = ''; show('login'); };
$('#reloadPrev').onclick = refreshPreview;

password ? load() : show('login');
</script>
</body>
</html>
